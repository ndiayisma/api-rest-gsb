name: Deploy to Elastic Beanstalk
on:
  push:
    branches:
    - AWS_delpoy


env:
  AWS_REGION: us-east-1
  S3_BUCKET: gsb-api-eb-bucket
  APP_NAME: test-gsb-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Run tests
      run: npm test -- --verbose

    - name: Generate deployment package
      run: |
        zip -r deploy.zip . \
          -x '*.git*' 'node_modules/*' '.github/*' 'coverage/*' 'dist/*' '.env*'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create S3 bucket (if not exists)
      run: |
        if ! aws s3 ls "s3://${{ env.S3_BUCKET }}" 2>/dev/null; then
          aws s3 mb "s3://${{ env.S3_BUCKET }}" --region ${{ env.AWS_REGION }}
          echo "Bucket created: ${{ env.S3_BUCKET }}"
        else
          echo "Bucket already exists: ${{ env.S3_BUCKET }}"
        fi
      continue-on-error: true

    - name: Upload deployment package to S3
      run: |
        aws s3 cp deploy.zip s3://${{ env.S3_BUCKET }}/deploys/${{ github.sha }}-${{ github.run_number }}.zip

    - name: Deploy to Elastic Beanstalk
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name ${{ env.APP_NAME }} \
          --version-label ${{ github.sha }}-${{ github.run_number }} \
          --source-bundle S3Bucket=${{ env.S3_BUCKET }},S3Key=deploys/${{ github.sha }}-${{ github.run_number }}.zip \
          --region ${{ env.AWS_REGION }} || true

        aws elasticbeanstalk update-environment \
          --application-name ${{ env.APP_NAME }} \
          --environment-name Test-gsb-api-env \
          --version-label ${{ github.sha }}-${{ github.run_number }} \
          --region ${{ env.AWS_REGION }}
